name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: ブラウザと日本語フォントをインストール
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: テスト
        env:
          TZ: Asia/Tokyo
        run: npm test

      - name: 失敗したときのスクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/output
